version: "3.8"
services:
  prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: parkinglot:prod
    stdin_open: true
    tty: true
  
  dev:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /src
    volumes:
      - ..:/src:rw
    command: ["dotnet", "run", "--project", "ParkingLot/ParkingLot.csproj"]
    stdin_open: true
    tty: true

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    image: parkinglot:test